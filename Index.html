<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دفتر الأقساط</title>
<meta name="theme-color" content="#EFEDE5" />
<link rel="manifest" href="manifest.json" />

<meta name="apple-mobile-web-app-title" content="دفتر الأقساط" />
<style>
:root{
  --ink:#1A2733; --paper:#EFEDE5; --card:#FAF9F5; --line:#DAD5C6;
  --paid:#3E7C6B; --due:#B8862B; --accent:#24405A; --danger:#A8442F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--paper); color:var(--ink); min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font-family:inherit;}
#root{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:40px;position:relative;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;}
.top-bar h2{margin:0;font-size:16px;font-weight:700;}
.icon-btn{background:none;border:none;padding:7px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;}
.icon-btn:hover{background:rgba(0,0,0,.05);}
.icon-btn.tiny{padding:4px;color:var(--danger);}
svg{display:block;}
.header{padding:calc(22px + env(safe-area-inset-top)) 18px 6px;}
.header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.stats-row{display:flex;gap:8px;padding:14px 18px 6px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.stat-box.highlight-due{border-color:var(--due);background:#F8F1E3;}
.stat-box-value{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-box-label{font-size:11px;color:#6B6558;text-align:center;}
.search-row{display:flex;align-items:center;gap:8px;margin:14px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
.search-row input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);}
.search-icon{color:#8C8676;flex-shrink:0;}
.tabs{display:flex;gap:6px;padding:12px 18px 4px;overflow-x:auto;}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.error-banner{margin:10px 18px 0;background:#FBE7E1;color:var(--danger);padding:8px 12px;border-radius:8px;font-size:12.5px;}
.sync-info{margin:10px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7;}
.sync-info strong{font-weight:700;}
.sync-ok{color:var(--paid);}
.sync-warn{color:var(--due);}
.small-btn{width:100%;margin-top:6px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;}
.list{padding:14px 18px 90px;display:flex;flex-direction:column;gap:10px;}
.empty-state{text-align:center;padding:50px 20px;color:#6B6558;}
.empty-state p{margin:4px 0;}
.empty-mini{color:#8C8676;font-size:13px;padding:10px 0;}
.sale-card{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;}
.sale-card-body{flex:1;min-width:0;}
.sale-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.customer-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.sale-card-bottom{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;}
.rem-amount{font-weight:700;font-variant-numeric:tabular-nums;}
.muted{color:#8C8676;font-size:12.5px;}
.clip-btn{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:#9A9484;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.clip-btn.attached{background:#E7EEF2;border-color:var(--accent);color:var(--accent);}
.mini-progress-track{height:5px;background:var(--line);border-radius:4px;overflow:hidden;}
.mini-progress-fill{height:100%;background:var(--paid);border-radius:4px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid;white-space:nowrap;flex-shrink:0;}
.badge.done,.badge.ok{background:#E4EEEA;color:var(--paid);border-color:var(--paid);}
.badge.due{background:#F3E8D6;color:var(--due);border-color:var(--due);}
.receipt-thumb{position:relative;flex-shrink:0;border-radius:4px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.18);border:3px solid #fff;cursor:pointer;}
.receipt-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.receipt-thumb.small{width:46px;height:46px;transform:rotate(-3deg);}
.receipt-thumb.large{width:84px;height:84px;transform:rotate(-2deg);}
.receipt-thumb .pin{position:absolute;top:-3px;right:50%;transform:translateX(50%);width:6px;height:6px;border-radius:50%;background:var(--due);box-shadow:0 1px 2px rgba(0,0,0,.4);}
.receipt-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px;cursor:pointer;}
.receipt-row-label{font-size:13px;}
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:24px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:10;}
.detail-body{padding:16px 18px 40px;}
.status-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.progress-block{margin-bottom:18px;}
.progress-track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
.progress-fill{height:100%;background:var(--paid);border-radius:5px;}
.progress-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:#6B6558;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
.stat-label{font-size:11.5px;color:#8C8676;}
.stat-value{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.notes-block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px;}
.notes-block p{margin:4px 0 0;font-size:13.5px;line-height:1.6;}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700;font-size:14px;}
.payments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.payment-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;}
.payment-row span:first-child{color:#6B6558;flex:1;}
.pay-amt{font-weight:700;font-variant-numeric:tabular-nums;}
.btn-secondary.full{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px dashed var(--accent);color:var(--accent);padding:11px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:4px;}
.btn-secondary.full:disabled{opacity:.5;cursor:default;border-style:solid;color:var(--paid);border-color:var(--paid);}
.add-payment-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px;}
.danger-zone{margin-top:26px;text-align:center;}
.confirm-row{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--danger);}
.lightbox{position:fixed;inset:0;background:rgba(15,15,15,.88);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;}
.form-wrap{padding:16px 18px 60px;display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;color:#6B6558;font-weight:600;}
.field input,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;font-size:14.5px;color:var(--ink);outline:none;font-family:inherit;width:100%;}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;min-width:0;}
.err{font-size:11.5px;color:var(--danger);}
.hint{font-size:12.5px;color:var(--accent);background:#E7EEF2;padding:8px 12px;border-radius:8px;}
.hint.muted-hint{color:#6B6558;background:var(--card);border:1px dashed var(--line);}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:7px;border:1px dashed var(--line);background:var(--card);padding:14px;border-radius:10px;color:#6B6558;font-size:13.5px;cursor:pointer;width:100%;}
.link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;display:inline-flex;align-items:center;gap:4px;}
.link-btn.danger{color:var(--danger);}
.form-actions{display:flex;gap:8px;margin-top:4px;}
.btn-primary{flex:1;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;}
.btn-primary:disabled{opacity:.6;cursor:default;}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:12px 16px;border-radius:10px;font-size:14px;cursor:pointer;}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,15,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
.modal-sheet{background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;}
.modal-body{padding:18px 16px 4px;display:flex;flex-direction:column;gap:12px;}
.modal-preview{display:flex;justify-content:center;}
.modal-preview img{max-width:100%;max-height:260px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.modal-actions{display:flex;flex-direction:column;align-items:center;gap:10px;}
.modal-busy{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px 0;color:#6B6558;font-size:13.5px;}
.modal-error{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#FBE7E1;color:var(--danger);padding:10px 12px;border-radius:8px;font-size:12.5px;}
.loading-screen{padding:60px 20px;text-align:center;}
@media (max-width:380px){.stat-box-label{font-size:10px}}
</style>

<script>
// v5: refresh the cached PWA shell without touching IndexedDB/local data.
(function(){
  try {
    const FLAG="installment_ledger_cache_reset_v5";
    if(localStorage.getItem(FLAG)!=="1"){
      localStorage.setItem(FLAG,"1");
      Promise.all([
        ("serviceWorker" in navigator) ? navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))) : Promise.resolve(),
        ("caches" in window) ? caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))) : Promise.resolve()
      ]).finally(()=>location.reload());
      throw new Error("CACHE_RESET");
    }
  }catch(e){ if(e && e.message==="CACHE_RESET") throw e; }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase configuration is intentionally embedded so this index.html is standalone.
   Only the public/publishable key belongs here. Never put a service_role key in this file. */
window.INSTALLMENT_SUPABASE_CONFIG = {
  url: "https://cxjigxowbdzhlthvweio.supabase.co",
  publishableKey: "sb_publishable_S6g9b2lUIj9TjIuPFID3gA_S5FYL4W_",
  bucket: "installment-receipts"
};

<script>
/* ---------------- Cloud Sync / Supabase ---------------- */
const cfg = window.INSTALLMENT_SUPABASE_CONFIG || {};
const SUPABASE_URL = cfg.url;
const SUPABASE_PUBLISHABLE_KEY = cfg.publishableKey;
const SUPABASE_BUCKET = cfg.bucket || "installment-receipts";

const cloud = {
  user:null,
  session:null,
  busy:false,
  status:"غير متصل",
  lastSync:null,
  error:null,
  lastErrorCode:null
};
let syncTimer=null;
let syncStarted=false;
let authListenerReady=false;

function getSupabaseClient(){
  if(!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) throw new Error("missing-supabase-config");
  if(!window.supabase?.createClient) throw new Error("supabase-library-missing");
  if(!window._installmentSupabaseClient){
    window._installmentSupabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:"implicit"
      }
    });
  }
  return window._installmentSupabaseClient;
}
const supabaseClient=getSupabaseClient();

function fmtCloudError(e){
  const msg=String(e?.message||e?.error_description||e||"");
  const lower=msg.toLowerCase();
  if(lower.includes("issued at future")||lower.includes("iat")||lower.includes("nbf")){
    return "وقت الجهاز غير متزامن مع وقت الخادم. فعّل التاريخ والوقت التلقائي في الجهاز ثم أغلق التطبيق وافتحه من جديد.";
  }
  if(lower.includes("invalid login credentials")) return "البريد أو كلمة المرور غير صحيحة.";
  if(lower.includes("email not confirmed")) return "أكد بريدك الإلكتروني من الرسالة التي أرسلها لك Supabase ثم سجّل الدخول.";
  if(lower.includes("failed to fetch")||lower.includes("network")) return "لا يوجد اتصال ثابت بالإنترنت. بياناتك المحلية محفوظة وستتم المزامنة لاحقًا.";
  if(lower.includes("jwt")) return "انتهت جلسة الدخول أو أن وقت الجهاز غير صحيح. سجّل الخروج ثم الدخول بعد تصحيح الوقت.";
  return msg || "تعذر الاتصال بالسحابة.";
}

async function rememberLastSync(iso){
  try{
    const db=await openDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction("sync_meta","readwrite");
      tx.objectStore("sync_meta").put({id:"lastSync",kind:"lastSync",value:iso});
      tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
    });
  }catch{}
}
async function getRememberedLastSync(){
  try{
    const db=await openDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction("sync_meta","readonly");
      const req=tx.objectStore("sync_meta").get("lastSync");
      req.onsuccess=()=>resolve(req.result?.value||null); req.onerror=()=>reject(req.error);
    });
  }catch{return null;}
}

function cloudLabel(){
  if(cloud.busy)return"جارِ المزامنة…";
  if(cloud.user)return cloud.lastSync?`تمت المزامنة ${fmtDateTime(cloud.lastSync)}`:"متصل بالسحابة";
  return"غير مسجل — البيانات محلية فقط";
}
function fmtDateTime(iso){
  try{return new Date(iso).toLocaleString("ar-SA",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return"";}
}
function scheduleCloudSync(){
  if(!navigator.onLine||!cloud.user)return;
  clearTimeout(syncTimer);
  // Short queue window prevents several keystroke/save events from racing each other.
  // The local IndexedDB write is already complete before this is called.
  syncTimer=setTimeout(()=>{syncTimer=null;syncAll().catch(()=>{});},250);
}
function saleToCloud(sale,userId){
  return{
    id:sale.id,user_id:userId,customer_name:sale.customerName,
    sale_value:Number(sale.saleValue),total_amount:Number(sale.totalAmount),
    installments_count:Number(sale.installmentsCount),start_date:sale.startDate,
    notes:sale.notes||"",payments:sale.payments||[],has_receipt:!!sale.hasReceipt,
    created_at:sale.createdAt||new Date().toISOString(),
    updated_at:sale.updatedAt||sale.createdAt||new Date().toISOString()
  };
}
function cloudToSale(row){
  return{
    id:row.id,customerName:row.customer_name,saleValue:Number(row.sale_value),
    totalAmount:Number(row.total_amount),installmentsCount:Number(row.installments_count),
    startDate:row.start_date,notes:row.notes||"",payments:row.payments||[],
    hasReceipt:!!row.has_receipt,createdAt:row.created_at,updatedAt:row.updated_at
  };
}
async function cloudUploadReceipt(saleId,blob){
  if(!cloud.user||!blob)return;
  const path=`${cloud.user.id}/${saleId}.jpg`;
  const {error}=await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path,blob,{
    contentType:"image/jpeg",upsert:true,cacheControl:"31536000"
  });
  if(error)throw error;
}
async function cloudDownloadReceipt(saleId){
  if(!cloud.user)return null;
  const {data,error}=await supabaseClient.storage.from(SUPABASE_BUCKET).download(`${cloud.user.id}/${saleId}.jpg`);
  return error?null:data;
}
async function cloudDeleteReceipt(saleId){
  if(!cloud.user)return;
  const {error}=await supabaseClient.storage.from(SUPABASE_BUCKET).remove([`${cloud.user.id}/${saleId}.jpg`]);
  if(error && !/not found/i.test(error.message||"")) throw error;
}
async function uploadSale(sale){
  if(!cloud.user)throw new Error("not-authenticated");
  const {error}=await supabaseClient.from("installment_sales").upsert(saleToCloud(sale,cloud.user.id),{onConflict:"id"});
  if(error)throw error;
  if(sale.hasReceipt){
    const blob=await dbGetReceipt(sale.id);
    if(blob)await cloudUploadReceipt(sale.id,blob);
  }else{
    try{await cloudDeleteReceipt(sale.id);}catch{}
  }
}
async function applyRemoteSale(row){
  const sale=cloudToSale(row);
  await dbPutSale(sale,{stamp:false});
  if(sale.hasReceipt){
    const blob=await cloudDownloadReceipt(sale.id);
    if(blob)await dbPutReceipt(sale.id,blob,{sync:false});
  }else{
    try{await dbDeleteReceipt(sale.id);}catch{}
  }
}
function remoteUpdatedAt(row){
  const t=new Date(row?.updated_at||row?.created_at||0).getTime();
  return Number.isFinite(t)?t:0;
}
function localUpdatedAt(sale){
  const t=new Date(sale?.updatedAt||sale?.createdAt||0).getTime();
  return Number.isFinite(t)?t:0;
}

async function syncAll(){
  if(cloud.busy||!navigator.onLine)return false;
  /* Always refresh/read the current Supabase session before a cloud request.
     This prevents an old access token from being used after the page has been
     left open for a while, and makes a newly-opened browser recover cleanly. */
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    cloud.session=data.session||null;
    cloud.user=data.session?.user||null;
  }catch(e){
    cloud.error=fmtCloudError(e);
    cloud.status="تعذر التحقق من الجلسة";
    updateCloudIndicator();
    return false;
  }
  if(!cloud.user)return false;
  cloud.busy=true;cloud.status="جارِ المزامنة…";cloud.error=null;cloud.lastErrorCode=null;updateCloudIndicator();
  try{
    /* Pull both live rows and deletion markers first. This makes a fresh browser
       download the user's cloud data instead of treating an empty IndexedDB as authoritative. */
    const [{data:remoteSales,error:salesErr},{data:remoteDeletes,error:delErr}]=await Promise.all([
      supabaseClient.from("installment_sales").select("*").eq("user_id",cloud.user.id),
      supabaseClient.from("installment_sale_deletions").select("*").eq("user_id",cloud.user.id)
    ]);
    if(salesErr)throw salesErr;
    if(delErr)throw delErr;

    let localSales=await dbGetAllSales();
    const remoteMap=new Map((remoteSales||[]).map(r=>[r.id,r]));
    const deletedMap=new Map((remoteDeletes||[]).map(r=>[r.id,r]));

    /* First apply cloud deletions to local data. */
    for(const sale of localSales){
      const tomb=deletedMap.get(sale.id);
      const lt=localUpdatedAt(sale);
      if(tomb && new Date(tomb.deleted_at).getTime()>=lt){
        await dbDeleteSale(sale.id,{sync:false});
        try{await dbDeleteReceipt(sale.id);}catch{}
      }
    }

    /* Upload local changes only when they are newer than the cloud copy. */
    localSales=await dbGetAllSales();
    for(const sale of localSales){
      const tomb=deletedMap.get(sale.id);
      if(tomb && new Date(tomb.deleted_at).getTime()>=localUpdatedAt(sale))continue;
      const remote=remoteMap.get(sale.id);
      if(!remote){
        await uploadSale(sale);
      }else if(localUpdatedAt(sale)>remoteUpdatedAt(remote)){
        await uploadSale(sale);
      }
    }

    /* Push local deletion markers and delete the cloud row. */
    const tombstones=await dbGetAllTombstones();
    for(const t of tombstones){
      /* Insert the tombstone instead of upsert. The table has RLS and upsert
         can invoke the UPDATE/USING policy on an existing key, which causes
         "violates row-level security policy (USING expression)" errors.
         A duplicate tombstone is already in the desired state, so it is safe
         to ignore only duplicate-key errors. */
      const {error:e1}=await supabaseClient.from("installment_sale_deletions")
        .insert({id:t.saleId,user_id:cloud.user.id,deleted_at:t.deletedAt});
      if(e1 && e1.code!=="23505")throw e1;
      const {error:e2}=await supabaseClient.from("installment_sales").delete().eq("id",t.saleId).eq("user_id",cloud.user.id);
      if(e2)throw e2;
      try{await cloudDeleteReceipt(t.saleId);}catch{}
      await dbDeleteTombstone(t.saleId);
    }

    /* Pull again after uploads/deletes so both devices converge to the same state. */
    const [{data:latest,error:latestErr},{data:latestDeletes,error:latestDelErr}]=await Promise.all([
      supabaseClient.from("installment_sales").select("*").eq("user_id",cloud.user.id),
      supabaseClient.from("installment_sale_deletions").select("*").eq("user_id",cloud.user.id)
    ]);
    if(latestErr)throw latestErr;
    if(latestDelErr)throw latestDelErr;
    const latestDeleted=new Map((latestDeletes||[]).map(r=>[r.id,r]));
    const latestLocal=await dbGetAllSales();
    const latestLocalMap=new Map(latestLocal.map(s=>[s.id,s]));

    for(const remote of (latest||[])){
      const tomb=latestDeleted.get(remote.id);
      if(tomb && new Date(tomb.deleted_at).getTime()>=remoteUpdatedAt(remote))continue;
      const local=latestLocalMap.get(remote.id);
      if(!local || remoteUpdatedAt(remote)>localUpdatedAt(local))await applyRemoteSale(remote);
      else if(local && remote.has_receipt && !local.hasReceipt){
        const blob=await cloudDownloadReceipt(remote.id);
        if(blob)await dbPutReceipt(remote.id,blob,{sync:false});
      }
    }

    /* Keep local rows that are absent remotely only if they are newer; otherwise
       a remote deletion marker wins. */
    for(const local of await dbGetAllSales()){
      const tomb=latestDeleted.get(local.id);
      if(tomb && new Date(tomb.deleted_at).getTime()>=localUpdatedAt(local)){
        await dbDeleteSale(local.id,{sync:false});
        try{await dbDeleteReceipt(local.id);}catch{}
      }
    }

    cloud.lastSync=new Date().toISOString();
    await rememberLastSync(cloud.lastSync);
    cloud.status="تمت المزامنة";
    await refreshSales();
    if(state.view==="list")renderListOnly();else if(document.getElementById("root"))render();
    return true;
  }catch(e){
    console.error("Cloud sync failed",e);
    cloud.status="تعذر الاتصال";
    cloud.error=fmtCloudError(e);
    cloud.lastErrorCode=e?.code||e?.status||null;
    return false;
  }finally{
    cloud.busy=false;updateCloudIndicator();
  }
}

  const el=document.getElementById("cloudStatus");
  if(el){
    el.textContent=cloud.user?(cloud.busy?"☁️ جارِ المزامنة":"☁️ متصل"):"☁️ محلي";
    el.title=cloudLabel();
  }
}

  };
  document.getElementById("loginBtn").onclick=()=>act("login");
  document.getElementById("signupBtn").onclick=()=>act("signup");

async function initCloud(){
  cloud.lastSync=await getRememberedLastSync();
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    cloud.session=data.session||null;
    cloud.user=data.session?.user||null;
    updateCloudIndicator();
    if(cloud.user){syncStarted=true;setTimeout(()=>syncAll().catch(()=>{}),250);}
  }catch(e){
    cloud.user=null;cloud.session=null;cloud.error=fmtCloudError(e);updateCloudIndicator();
  }
  if(!authListenerReady){
    authListenerReady=true;
    supabaseClient.auth.onAuthStateChange((event,session)=>{
      cloud.session=session||null;
      cloud.user=session?.user||null;
      if(event==="SIGNED_OUT"){
        syncStarted=false;cloud.lastSync=null;cloud.error=null;
      }else if(session){
        syncStarted=true;
        setTimeout(()=>syncAll().catch(()=>{}),100);
      }
      updateCloudIndicator();
    });
  }
}

<script>
/* ---------------- IndexedDB layer ---------------- */
const DB_NAME="installmentLedgerDB";
const DB_VERSION=2;
let dbPromise=null;
function openDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains("sales"))db.createObjectStore("sales",{keyPath:"id"});
      if(!db.objectStoreNames.contains("receipts"))db.createObjectStore("receipts",{keyPath:"id"});
      if(!db.objectStoreNames.contains("sync_meta"))db.createObjectStore("sync_meta",{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
  return dbPromise;
}
async function dbGetAllSales(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("sales","readonly"),store=tx.objectStore("sales"),req=store.getAll();
    req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);
  });
}
async function dbPutSale(sale,options={}){
  if(options.stamp!==false)sale={...sale,updatedAt:new Date().toISOString()};
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("sales","readwrite");tx.objectStore("sales").put(sale);
    tx.oncomplete=()=>{resolve(true);if(options.stamp!==false)scheduleCloudSync();};
    tx.onerror=()=>reject(tx.error);
  });
}
async function dbDeleteSale(id,options={}){
  if(options.sync!==false){try{await dbPutTombstone(id);}catch{}}
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("sales","readwrite");tx.objectStore("sales").delete(id);
    tx.oncomplete=()=>{resolve(true);if(options.sync!==false)scheduleCloudSync();};tx.onerror=()=>reject(tx.error);
  });
}
async function dbPutReceipt(id,blob,options={}){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("receipts","readwrite");tx.objectStore("receipts").put({id,blob});
    tx.oncomplete=()=>{resolve(true);if(options.sync!==false)scheduleCloudSync();};tx.onerror=()=>reject(tx.error);
  });
}
async function dbGetReceipt(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("receipts","readonly"),req=tx.objectStore("receipts").get(id);
    req.onsuccess=()=>resolve(req.result?req.result.blob:null);req.onerror=()=>reject(req.error);
  });
}
async function dbDeleteReceipt(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("receipts","readwrite");tx.objectStore("receipts").delete(id);
    tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
  });
}
async function dbPutTombstone(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("sync_meta","readwrite");
    tx.objectStore("sync_meta").put({id:`deleted:${id}`,kind:"deleted",saleId:id,deletedAt:new Date().toISOString()});
    tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
  });
}
async function dbGetAllTombstones(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("sync_meta","readonly"),req=tx.objectStore("sync_meta").getAll();
    req.onsuccess=()=>resolve((req.result||[]).filter(x=>x.kind==="deleted"));req.onerror=()=>reject(req.error);
  });
}
async function dbDeleteTombstone(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("sync_meta","readwrite");tx.objectStore("sync_meta").delete(`deleted:${id}`);
    tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
  });
}
/* ---------------- Helpers ---------------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtMoney(n){const v=Math.round((Number(n)+Number.EPSILON)*100)/100;return v.toLocaleString("en-US",{maximumFractionDigits:2});}
function fmtDate(s){if(!s)return"";const d=new Date(s);if(isNaN(d.getTime()))return s;return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});}
function totalPaid(sale){return(sale.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);}
function remaining(sale){return Math.max(sale.totalAmount-totalPaid(sale),0);}
function installmentAmount(sale){return sale.installmentsCount>0?sale.totalAmount/sale.installmentsCount:0;}
function paidInstallmentsCount(sale){const inst=installmentAmount(sale);if(inst<=0)return 0;return Math.min(sale.installmentsCount,Math.floor(totalPaid(sale)/inst+1e-6));}
function isComplete(sale){return remaining(sale)<=.01;}
function paidThisMonth(sale){const now=new Date();return(sale.payments||[]).some(p=>{const d=new Date(p.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=1400,scale=Math.min(1,maxW/img.width),canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("compress-failed")),"image/jpeg",.82);
      };
      img.onerror=()=>reject(new Error("decode-failed"));img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("read-failed"));reader.readAsDataURL(file);
  });
}
function badgeHTML(sale){

  if(paidThisMonth(sale))return`<span class="badge ok">سدد هذا الشهر</span>`;

}
const ICONS={

  download:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  upload:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`
};
const state={loading:true,sales:[],view:"list",selectedId:null,search:"",filter:"all",errorMsg:null,attachId:null,showBackup:false,addingPayment:false,confirmDeleteSale:false};
let activeObjectUrls=[];
function trackObjectUrl(url){activeObjectUrls.push(url);return url;}

function getSelected(){return state.sales.find(s=>s.id===state.selectedId);}
function renderListScreen(){
  const totalOutstanding=state.sales.reduce((sum,s)=>sum+remaining(s),0);
  const unpaidThisMonth=state.sales.filter(s=>!isComplete(s)&&!paidThisMonth(s)).length;
  const filtered=state.sales.filter(s=>s.customerName.toLowerCase().includes(state.search.toLowerCase())).filter(s=>{
    if(state.filter==="unpaid")return !isComplete(s)&&!paidThisMonth(s);
    if(state.filter==="done")return isComplete(s);return true;

  async function doUpload(file){
    body.innerHTML=`<div class="modal-busy">${ICONS.loader}<span>جارِ حفظ الصورة...</span></div>`;
    try{const blob=await compressImageFile(file);await dbPutReceipt(sale.id,blob);const updated={...sale,hasReceipt:true};await dbPutSale(updated);await refreshSales();const fresh=state.sales.find(s=>s.id===sale.id);Object.assign(sale,fresh);renderModalIdle(blob);refreshListCardClip(sale.id,true);}catch{renderModalIdle(null);const errDiv=document.createElement("div");errDiv.className="modal-error";errDiv.innerHTML=`${ICONS.alert}<span>تعذر حفظ الصورة، جرّب مرة أخرى</span>`;body.appendChild(errDiv);}
  }
  async function doRemove(){
    body.innerHTML=`<div class="modal-busy">${ICONS.loader}<span>جارِ الإزالة...</span></div>`;
    try{await dbDeleteReceipt(sale.id);}catch{}
    const updated={...sale,hasReceipt:false};await dbPutSale(updated);await refreshSales();const fresh=state.sales.find(s=>s.id===sale.id);Object.assign(sale,fresh);renderModalIdle(null);refreshListCardClip(sale.id,false);
  }
}
function refreshListCardClip(id,hasReceipt){
  const clip=document.querySelector(`[data-attach="${id}"]`);if(clip)clip.classList.toggle("attached",hasReceipt);
  if(state.view==="detail"&&state.selectedId===id){const sale=getSelected();if(sale)bindDetailEvents();}
}
init();
if("serviceWorker"in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js?v=5").catch(()=>{});});
</script>
</body>
