<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دفتر الأقساط</title>
<meta name="theme-color" content="#EFEDE5" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="دفتر الأقساط" />
<style>
:root{
  --ink:#1A2733; --paper:#EFEDE5; --card:#FAF9F5; --line:#DAD5C6;
  --paid:#3E7C6B; --due:#B8862B; --accent:#24405A; --danger:#A8442F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--paper); color:var(--ink); min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button, input, textarea { font-family: inherit; }
#root{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:40px;position:relative;}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;}
.top-bar h2{margin:0;font-size:16px;font-weight:700;}
.icon-btn{background:none;border:none;padding:7px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;}
.icon-btn:hover{background:rgba(0,0,0,0.05);}
.icon-btn.tiny{padding:4px;color:var(--danger);}
svg{display:block;}

.header{padding:calc(22px + env(safe-area-inset-top)) 18px 6px;}
.header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.01em;}

.stats-row{display:flex;gap:8px;padding:14px 18px 6px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.stat-box.highlight-due{border-color:var(--due);background:#F8F1E3;}
.stat-box-value{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-box-label{font-size:11px;color:#6B6558;text-align:center;}

.search-row{display:flex;align-items:center;gap:8px;margin:14px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
.search-row input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);}
.search-icon{color:#8C8676;flex-shrink:0;}

.tabs{display:flex;gap:6px;padding:12px 18px 4px;overflow-x:auto;}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.error-banner{margin:10px 18px 0;background:#FBE7E1;color:var(--danger);padding:8px 12px;border-radius:8px;font-size:12.5px;}

.list{padding:14px 18px 90px;display:flex;flex-direction:column;gap:10px;}
.empty-state{text-align:center;padding:50px 20px;color:#6B6558;}
.empty-state p{margin:4px 0;}
.empty-mini{color:#8C8676;font-size:13px;padding:10px 0;}

.sale-card{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;}
.sale-card-body{flex:1;min-width:0;}
.sale-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.customer-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.sale-card-bottom{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;}
.rem-amount{font-weight:700;font-variant-numeric:tabular-nums;}
.muted{color:#8C8676;font-size:12.5px;}

.clip-btn{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:#9A9484;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.clip-btn.attached{background:#E7EEF2;border-color:var(--accent);color:var(--accent);}

.mini-progress-track{height:5px;background:var(--line);border-radius:4px;overflow:hidden;}
.mini-progress-fill{height:100%;background:var(--paid);border-radius:4px;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid;white-space:nowrap;flex-shrink:0;}
.badge.done{background:#E4EEEA;color:var(--paid);border-color:var(--paid);}
.badge.ok{background:#E4EEEA;color:var(--paid);border-color:var(--paid);}
.badge.due{background:#F3E8D6;color:var(--due);border-color:var(--due);}

.receipt-thumb{position:relative;flex-shrink:0;border-radius:4px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.18);border:3px solid #fff;cursor:pointer;}
.receipt-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.receipt-thumb.small{width:46px;height:46px;transform:rotate(-3deg);}
.receipt-thumb.large{width:84px;height:84px;transform:rotate(-2deg);}
.receipt-thumb .pin{position:absolute;top:-3px;right:50%;transform:translateX(50%);width:6px;height:6px;border-radius:50%;background:var(--due);box-shadow:0 1px 2px rgba(0,0,0,0.4);}

.receipt-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px;cursor:pointer;}
.receipt-row-label{font-size:13px;}

.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:24px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.25);cursor:pointer;z-index:10;}

.detail-body{padding:16px 18px 40px;}
.status-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}

.progress-block{margin-bottom:18px;}
.progress-track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
.progress-fill{height:100%;background:var(--paid);border-radius:5px;}
.progress-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:#6B6558;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
.stat-label{font-size:11.5px;color:#8C8676;}
.stat-value{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}

.notes-block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px;}
.notes-block p{margin:4px 0 0;font-size:13.5px;line-height:1.6;}

.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700;font-size:14px;}

.payments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.payment-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;}
.payment-row span:first-child{color:#6B6558;flex:1;}
.pay-amt{font-weight:700;font-variant-numeric:tabular-nums;}

.btn-secondary.full{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px dashed var(--accent);color:var(--accent);padding:11px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:4px;}
.btn-secondary.full:disabled{opacity:0.5;cursor:default;border-style:solid;color:var(--paid);border-color:var(--paid);}

.add-payment-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px;}

.danger-zone{margin-top:26px;text-align:center;}
.confirm-row{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--danger);}

.lightbox{position:fixed;inset:0;background:rgba(15,15,15,0.88);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;}

.form-wrap{padding:16px 18px 60px;display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;color:#6B6558;font-weight:600;}
.field input, .field textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;font-size:14.5px;color:var(--ink);outline:none;font-family:inherit;width:100%;}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;min-width:0;}
.err{font-size:11.5px;color:var(--danger);}
.hint{font-size:12.5px;color:var(--accent);background:#E7EEF2;padding:8px 12px;border-radius:8px;}
.hint.muted-hint{color:#6B6558;background:var(--card);border:1px dashed var(--line);}

.upload-btn{display:flex;align-items:center;justify-content:center;gap:7px;border:1px dashed var(--line);background:var(--card);padding:14px;border-radius:10px;color:#6B6558;font-size:13.5px;cursor:pointer;width:100%;}
.link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;display:inline-flex;align-items:center;gap:4px;}
.link-btn.danger{color:var(--danger);}

.form-actions{display:flex;gap:8px;margin-top:4px;}
.btn-primary{flex:1;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;}
.btn-primary:disabled{opacity:0.6;cursor:default;}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:12px 16px;border-radius:10px;font-size:14px;cursor:pointer;}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}

.spin{animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,15,15,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
.modal-sheet{background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;}
.modal-body{padding:18px 16px 4px;display:flex;flex-direction:column;gap:12px;}
.modal-preview{display:flex;justify-content:center;}
.modal-preview img{max-width:100%;max-height:260px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.modal-actions{display:flex;flex-direction:column;align-items:center;gap:10px;}
.modal-busy{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px 0;color:#6B6558;font-size:13.5px;}
.modal-error{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#FBE7E1;color:var(--danger);padding:10px 12px;border-radius:8px;font-size:12.5px;}

.loading-screen{padding:60px 20px;text-align:center;}

@media (max-width:380px){ .stat-box-label{font-size:10px;} }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------- IndexedDB layer ---------------- */
const DB_NAME = "installmentLedgerDB";
const DB_VERSION = 1;
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("sales")) {
        db.createObjectStore("sales", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("receipts")) {
        db.createObjectStore("receipts", { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function dbGetAllSales() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("sales", "readonly");
    const store = tx.objectStore("sales");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbPutSale(sale) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("sales", "readwrite");
    tx.objectStore("sales").put(sale);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function dbDeleteSale(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("sales", "readwrite");
    tx.objectStore("sales").delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function dbPutReceipt(id, blob) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("receipts", "readwrite");
    tx.objectStore("receipts").put({ id, blob });
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGetReceipt(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("receipts", "readonly");
    const req = tx.objectStore("receipts").get(id);
    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
    req.onerror = () => reject(req.error);
  });
}

async function dbDeleteReceipt(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("receipts", "readwrite");
    tx.objectStore("receipts").delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- Helpers ---------------- */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function fmtMoney(n) {
  const v = Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
}
function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function totalPaid(sale) {
  return (sale.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
}
function remaining(sale) {
  return Math.max(sale.totalAmount - totalPaid(sale), 0);
}
function installmentAmount(sale) {
  return sale.installmentsCount > 0 ? sale.totalAmount / sale.installmentsCount : 0;
}
function paidInstallmentsCount(sale) {
  const inst = installmentAmount(sale);
  if (inst <= 0) return 0;
  return Math.min(sale.installmentsCount, Math.floor(totalPaid(sale) / inst + 1e-6));
}
function isComplete(sale) {
  return remaining(sale) <= 0.01;
}
function paidThisMonth(sale) {
  const now = new Date();
  return (sale.payments || []).some((p) => {
    const d = new Date(p.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Compress to a reasonable size (IndexedDB has plenty of room, this is just
// to keep the app snappy and save device space).
function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1400;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("compress-failed"));
        }, "image/jpeg", 0.82);
      };
      img.onerror = () => reject(new Error("decode-failed"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("read-failed"));
    reader.readAsDataURL(file);
  });
}

function badgeHTML(sale) {
  if (isComplete(sale)) return `<span class="badge done"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> مكتمل السداد</span>`;
  if (paidThisMonth(sale)) return `<span class="badge ok">سدد هذا الشهر</span>`;
  return `<span class="badge due"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> لم يسدد هذا الشهر</span>`;
}

const ICONS = {
  plus: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  search: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  back: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
  pencil: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`,
  trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>`,
  clip: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`,
  x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  image: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  loader: `<svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`,
  alert: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
};

/* ---------------- App state ---------------- */
const state = {
  loading: true,
  sales: [],
  view: "list", // list | add | detail | edit
  selectedId: null,
  search: "",
  filter: "all",
  errorMsg: null,
  attachId: null, // id of sale currently in the attach modal
  addingPayment: false,
  confirmDeleteSale: false,
};

// Object URLs created for the currently-open detail/modal image, revoked on
// the next render to avoid leaking memory.
let activeObjectUrls = [];
function trackObjectUrl(url) {
  activeObjectUrls.push(url);
  return url;
}
function revokeTrackedUrls() {
  activeObjectUrls.forEach((u) => URL.revokeObjectURL(u));
  activeObjectUrls = [];
}

async function refreshSales() {
  state.sales = await dbGetAllSales();
}

function root() {
  return document.getElementById("root");
}

async function init() {
  try {
    await refreshSales();
  } catch (e) {
    state.errorMsg = "تعذر تحميل البيانات المحفوظة";
  }
  state.loading = false;
  render();
}

/* ---------------- Render ---------------- */
function render() {
  revokeTrackedUrls();
  const r = root();
  if (state.loading) {
    r.innerHTML = `<div class="loading-screen">جارِ التحميل...</div>`;
    return;
  }
  let html = "";
  if (state.view === "add") html = renderFormScreen(null);
  else if (state.view === "edit") html = renderFormScreen(getSelected());
  else if (state.view === "detail") html = renderDetailScreen(getSelected());
  else html = renderListScreen();

  const modal = state.attachId ? renderAttachModalShell() : "";
  r.innerHTML = html + modal;
  bindGlobalEvents();
  if (state.view === "add" || state.view === "edit") bindFormEvents();
  if (state.view === "detail") bindDetailEvents();
  if (state.view === "list") bindListEvents();
  if (state.attachId) loadAttachModalContent();
}

function getSelected() {
  return state.sales.find((s) => s.id === state.selectedId);
}

/* ----- List screen ----- */
function renderListScreen() {
  const totalOutstanding = state.sales.reduce((sum, s) => sum + remaining(s), 0);
  const unpaidThisMonth = state.sales.filter((s) => !isComplete(s) && !paidThisMonth(s)).length;

  const filtered = state.sales
    .filter((s) => s.customerName.toLowerCase().includes(state.search.toLowerCase()))
    .filter((s) => {
      if (state.filter === "unpaid") return !isComplete(s) && !paidThisMonth(s);
      if (state.filter === "done") return isComplete(s);
      return true;
    })
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const cardsHTML = filtered.length === 0
    ? `<div class="empty-state">${state.sales.length === 0
        ? "<p>ما سجلت أي عميل لسه.</p><p class='muted'>ابدأ بإضافة أول بيعة بالتقسيط.</p>"
        : "<p>لا توجد نتائج مطابقة.</p>"}</div>`
    : filtered.map((s) => {
        const rem = remaining(s);
        const paidCount = paidInstallmentsCount(s);
        const progress = s.totalAmount > 0 ? Math.min(100, (totalPaid(s) / s.totalAmount) * 100) : 0;
        return `
        <div class="sale-card" data-open="${s.id}">
          <div class="sale-card-body">
            <div class="sale-card-top">
              <span class="customer-name">
                ${esc(s.customerName)}
                <button type="button" class="clip-btn ${s.hasReceipt ? "attached" : ""}" data-attach="${s.id}" title="السند">${ICONS.clip}</button>
              </span>
              ${badgeHTML(s)}
            </div>
            <div class="mini-progress-track"><div class="mini-progress-fill" style="width:${progress}%"></div></div>
            <div class="sale-card-bottom">
              <span class="muted">${paidCount} / ${s.installmentsCount} قسط</span>
              <span class="rem-amount">${fmtMoney(rem)} ريال متبقي</span>
            </div>
          </div>
        </div>`;
      }).join("");

  return `
  <div class="screen">
    <div class="header"><h1>دفتر الأقساط</h1></div>
    <div class="stats-row">
      <div class="stat-box"><span class="stat-box-value">${state.sales.length}</span><span class="stat-box-label">إجمالي العملاء</span></div>
      <div class="stat-box highlight-due"><span class="stat-box-value">${unpaidThisMonth}</span><span class="stat-box-label">لم يسددوا هذا الشهر</span></div>
      <div class="stat-box"><span class="stat-box-value">${fmtMoney(totalOutstanding)}</span><span class="stat-box-label">إجمالي المتبقي (ريال)</span></div>
    </div>
    <div class="search-row">${ICONS.search}<input id="searchInput" placeholder="بحث باسم العميل" value="${esc(state.search)}" /></div>
    <div class="tabs">
      <button class="tab ${state.filter === "all" ? "active" : ""}" data-filter="all">الكل</button>
      <button class="tab ${state.filter === "unpaid" ? "active" : ""}" data-filter="unpaid">لم يسدد هذا الشهر</button>
      <button class="tab ${state.filter === "done" ? "active" : ""}" data-filter="done">مكتمل</button>
    </div>
    ${state.errorMsg ? `<div class="error-banner">${esc(state.errorMsg)}</div>` : ""}
    <div class="list">${cardsHTML}</div>
    <button class="fab" id="addBtn">${ICONS.plus}</button>
  </div>`;
}

function bindListEvents() {
  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      renderListOnly();
    });
  }
  document.querySelectorAll("[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => { state.filter = btn.dataset.filter; render(); });
  });
  document.getElementById("addBtn").addEventListener("click", () => { state.view = "add"; render(); });
  document.querySelectorAll("[data-open]").forEach((card) => {
    card.addEventListener("click", (e) => {
      if (e.target.closest("[data-attach]")) return;
      state.selectedId = card.dataset.open;
      state.view = "detail";
      render();
    });

  document.querySelectorAll("[data-attach]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      state.attachId = btn.dataset.attach;
      render();
    });
  });
}

function bindFormEvents() {
  const isEdit = state.view === "edit";
  document.getElementById("formBack").addEventListener("click", goBackFromForm);
  document.getElementById("formCancel").addEventListener("click", goBackFromForm);

  function updateHints() {
    const sv = Number(document.getElementById("f_saleValue").value);
    const ta = Number(document.getElementById("f_totalAmount").value);
    const cnt = Number(document.getElementById("f_count").value);
    const hInterest = document.getElementById("hint_interest");
    const hInst = document.getElementById("hint_installment");
    const errAmounts = document.getElementById("err_amounts");
    if (sv > 0 && ta > 0) {
      hInterest.style.display = "block";
      hInterest.innerHTML = `مقدار الفائدة: <b>${fmtMoney(ta - sv)}</b> ريال`;
      errAmounts.style.display = ta < sv ? "block" : "none";
    } else {
      hInterest.style.display = "none";
      errAmounts.style.display = "none";
    }
    if (cnt > 0 && ta > 0) {
      hInst.style.display = "block";
      hInst.innerHTML = `قيمة القسط الواحد: <b>${fmtMoney(ta / cnt)}</b> ريال`;
    } else {
      hInst.style.display = "none";
    }
  }
  ["f_saleValue", "f_totalAmount", "f_count"].forEach((id) => {
    document.getElementById(id).addEventListener("input", updateHints);
  });
  updateHints();

  document.getElementById("formSave").addEventListener("click", async () => {
    const name = document.getElementById("f_name").value.trim();
    const saleValue = Number(document.getElementById("f_saleValue").value);
    const totalAmount = Number(document.getElementById("f_totalAmount").value);
    const installmentsCount = Number(document.getElementById("f_count").value);
    const startDate = document.getElementById("f_date").value || todayStr();
    const notes = document.getElementById("f_notes").value.trim();

    const valid = name && saleValue > 0 && totalAmount > 0 && Number.isInteger(installmentsCount) && installmentsCount >= 1;
    if (!valid) {
      document.getElementById("err_name").style.display = name ? "none" : "block";
      return;
    }

    const btn = document.getElementById("formSave");
    btn.disabled = true;
    btn.textContent = "جارِ الحفظ...";
    state.errorMsg = null;

    try {
      if (isEdit) {
        const sale = getSelected();
        const updated = { ...sale, customerName: name, saleValue, totalAmount, installmentsCount, startDate, notes };
        await dbPutSale(updated);
      } else {
        const newSale = {
          id: uid(), customerName: name, saleValue, totalAmount, installmentsCount, startDate, notes,
          payments: [], hasReceipt: false, createdAt: new Date().toISOString(),
        };
        await dbPutSale(newSale);
      }
      await refreshSales();
      state.view = isEdit ? "detail" : "list";
      render();
    } catch (e) {
      state.errorMsg = "تعذر حفظ البيانات، حاول مرة أخرى";
      btn.disabled = false;
      btn.textContent = isEdit ? "حفظ التعديلات" : "حفظ";
      render();
    }
  });
}

function goBackFromForm() {
  state.errorMsg = null;
  state.view = state.selectedId ? "detail" : "list";
  render();
}

async function bindDetailEvents() {
  const sale = getSelected();
  document.getElementById("detailBack").addEventListener("click", () => {
    state.view = "list"; state.selectedId = null; state.addingPayment = false; state.confirmDeleteSale = false; render();
  });
  document.getElementById("detailEdit").addEventListener("click", () => { state.view = "edit"; render(); });
  document.getElementById("receiptRow").addEventListener("click", () => { state.attachId = sale.id; render(); });

  document.querySelectorAll("[data-removepay]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const updated = { ...sale, payments: sale.payments.filter((p) => p.id !== btn.dataset.removepay) };
      await dbPutSale(updated);
      await refreshSales();
      render();
    });
  });

  const startBtn = document.getElementById("startAddPayment");
  if (startBtn) startBtn.addEventListener("click", () => { state.addingPayment = true; render(); });
  const cancelBtn = document.getElementById("cancelAddPayment");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.addingPayment = false; render(); });
  const confirmBtn = document.getElementById("confirmAddPayment");
  if (confirmBtn) confirmBtn.addEventListener("click", async () => {
    const amt = Number(document.getElementById("payAmount").value);
    const date = document.getElementById("payDate").value || todayStr();
    if (!amt || amt <= 0) return;
    const updated = { ...sale, payments: [...(sale.payments || []), { id: uid(), amount: amt, date }] };
    await dbPutSale(updated);
    await refreshSales();
    state.addingPayment = false;
    render();
  });

  const startDelete = document.getElementById("startDelete");
  if (startDelete) startDelete.addEventListener("click", () => {
    document.getElementById("dangerZone").innerHTML = `
      <div class="confirm-row">
        <span>متأكد من الحذف؟ لا يمكن التراجع.</span>
        <button class="btn-danger" id="confirmDelete">نعم، احذف</button>
        <button class="btn-ghost" id="cancelDelete">تراجع</button>
      </div>`;
    document.getElementById("confirmDelete").addEventListener("click", async () => {
      await dbDeleteSale(sale.id);
      if (sale.hasReceipt) { try { await dbDeleteReceipt(sale.id); } catch (e) {} }
      await refreshSales();
      state.view = "list"; state.selectedId = null;
      render();
    });
    document.getElementById("cancelDelete").addEventListener("click", () => render());
  });

  // Load receipt preview for the row
  const row = document.getElementById("receiptRow");
  if (sale.hasReceipt) {
    try {
      const blob = await dbGetReceipt(sale.id);
      if (blob) {
        const url = trackObjectUrl(URL.createObjectURL(blob));
        row.innerHTML = `
          <div class="receipt-thumb small"><img src="${url}" /><div class="pin"></div></div>
          <span class="receipt-row-label">سند البيع مرفق — اضغط للتغيير</span>`;
        row.querySelector(".receipt-thumb").addEventListener("click", (e) => {
          e.stopPropagation();
          openLightbox(url);
        });
      } else {
        row.innerHTML = `${ICONS.clip}<span class="receipt-row-label muted">لا يوجد سند مرفق — اضغط للإرفاق</span>`;
      }
    } catch (e) {
      row.innerHTML = `${ICONS.clip}<span class="receipt-row-label muted">لا يوجد سند مرفق — اضغط للإرفاق</span>`;
    }
  } else {
    row.innerHTML = `${ICONS.clip}<span class="receipt-row-label muted">لا يوجد سند مرفق — اضغط للإرفاق</span>`;
  }
}

function openLightbox(url) {
  const div = document.createElement("div");
  div.className = "lightbox";
  div.innerHTML = `<img src="${url}" />`;
  div.addEventListener("click", () => div.remove());
  document.body.appendChild(div);
}

function closeAttachModal() {
  state.attachId = null;
  render();

async function loadAttachModalContent() {
  const sale = state.sales.find((s) => s.id === state.attachId);
  if (!sale) return;
  const body = document.getElementById("modalBody");
  if (!body) return;

  let currentBlob = null;
  if (sale.hasReceipt) {
    try { currentBlob = await dbGetReceipt(sale.id); } catch (e) { currentBlob = null; }
  }
  renderModalIdle(currentBlob);

  function renderModalIdle(blob) {
    if (blob) {
      const url = trackObjectUrl(URL.createObjectURL(blob));
      body.innerHTML = `
        <div class="modal-preview"><img src="${url}" /></div>
        <div class="modal-actions">
          <button class="btn-secondary full" id="modalReplace">${ICONS.image} استبدال الصورة</button>
          <button class="link-btn danger" id="modalRemove">إزالة السند</button>
        </div>
        <input type="file" accept="image/*" id="modalFile" style="display:none;" />`;
    } else {
      body.innerHTML = `
        <button class="upload-btn" id="modalPick">${ICONS.image} إرفاق الصورة من ألبوم الصور</button>
        <input type="file" accept="image/*" id="modalFile" style="display:none;" />`;
    }
    const fileInput = document.getElementById("modalFile");
    const openPicker = () => fileInput.click();
    const pickBtn = document.getElementById("modalPick");
    const replaceBtn = document.getElementById("modalReplace");
    if (pickBtn) pickBtn.addEventListener("click", openPicker);
    if (replaceBtn) replaceBtn.addEventListener("click", openPicker);
    const removeBtn = document.getElementById("modalRemove");
    if (removeBtn) removeBtn.addEventListener("click", doRemove);
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (!file) return;
      await doUpload(file);
    });
  }

  async function doUpload(file) {
    body.innerHTML = `<div class="modal-busy">${ICONS.loader}<span>جارِ حفظ الصورة...</span></div>`;
    try {
      const blob = await compressImageFile(file);
      await dbPutReceipt(sale.id, blob);
      const updated = { ...sale, hasReceipt: true };
      await dbPutSale(updated);
      await refreshSales();
      const fresh = state.sales.find((s) => s.id === sale.id);
      Object.assign(sale, fresh);
      renderModalIdle(blob);
      refreshListCardClip(sale.id, true);
    } catch (e) {
      renderModalIdle(null);
      const errDiv = document.createElement("div");
      errDiv.className = "modal-error";
      errDiv.innerHTML = `${ICONS.alert}<span>تعذر حفظ الصورة، جرّب مرة أخرى</span>`;
      body.appendChild(errDiv);
    }
  }

  async function doRemove() {
    body.innerHTML = `<div class="modal-busy">${ICONS.loader}<span>جارِ الإزالة...</span></div>`;
    try { await dbDeleteReceipt(sale.id); } catch (e) {}
    const updated = { ...sale, hasReceipt: false };
    await dbPutSale(updated);
    await refreshSales();
    const fresh = state.sales.find((s) => s.id === sale.id);
    Object.assign(sale, fresh);
    renderModalIdle(null);
    refreshListCardClip(sale.id, false);
  }
}

function refreshListCardClip(id, hasReceipt) {
  const clip = document.querySelector(`[data-attach="${id}"]`);
  if (clip) clip.classList.toggle("attached", hasReceipt);
  if (state.view === "detail" && state.selectedId === id) {
    // refresh the receipt row preview next time detail re-renders fully
    const sale = getSelected();
    if (sale) bindDetailEvents();
  }
}

/* ---------------- Boot ---------------- */
init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
